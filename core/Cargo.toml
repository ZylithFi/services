[package]
name = "zylith-core"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
generic-array = { version = "0.14", features = ["zeroize"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "chacha", "x25519"] }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
rand = "0.9"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
starknet-crypto = "0.8.1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1"
