[package]
name = "zylith-prover"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true

[dependencies]
aes-gcm = "0.10"
axum = "0.8"
bhttp = "0.7"
hex = "0.4"
ipnet = "2"
num-bigint = "0.4"
ohttp = "0.7"
p256 = { version = "0.13", features = ["ecdh"] }
rand_core = "0.6"
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
reqwest_013 = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
starknet-crypto = "0.8.1"
sha2 = "0.10"
starknet-rust-accounts = "0.19"
starknet-rust-core = "0.19"
starknet-rust-providers = "0.19"
starknet-rust-signers = "0.19"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
url = "2"
zeroize = "1"
zylith-core = { path = "../core" }
